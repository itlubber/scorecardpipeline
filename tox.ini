[tox]
envlist = py{38,39,310,311,312}
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
    shap
extras =
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pytest {posargs:tests/ -q --tb=short --cov=scorecardpipeline --cov-report=xml}

[testenv:lint]
deps =
    ruff
    black
skip_install = True
commands =
    ruff check tests/ scorecardpipeline/explainability.py scorecardpipeline/monitoring.py scorecardpipeline/calibration.py scorecardpipeline/scorecard.py scorecardpipeline/processing.py
    black --check tests/ scorecardpipeline/explainability.py scorecardpipeline/monitoring.py scorecardpipeline/calibration.py scorecardpipeline/scorecard.py
